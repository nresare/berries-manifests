# Source: nack
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nack
  namespace: nats
  labels:
    app: nack
    chart: nack-0.34.1_noa.1
  annotations:
    noa.re/deploy-id: b6e8423573e89147
spec:
  selector:
    matchLabels:
      app: nack
  replicas: 1
  template:
    metadata:
      labels:
        app: nack
        chart: nack-0.34.1_noa.1
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
      - name: runtime
        emptyDir: {}
      - name: tokens
        projected:
          sources:
          - serviceAccountToken:
              path: nats
              expirationSeconds: 3600
              audience: nats
      serviceAccountName: jetstream-controller
      containers:
      - name: jsc
        image: nresare/jetstream-controller:issue-380
        imagePullPolicy: IfNotPresent
        workingDir: /nack
        command:
        - /jetstream-controller
        args:
        - -s=nats://nats.nats.svc
        - --health-probe-bind-address=:8081
        - --control-loop
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: runtime
          mountPath: /nack
        - name: tokens
          mountPath: /var/run/secrets/tokens
          readOnly: true
