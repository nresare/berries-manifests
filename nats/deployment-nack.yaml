# Source: nack
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nack
  namespace: nats
  labels:
    app: nack
    chart: nack-0.34.0_noa
  annotations:
    noa.re/deploy-id: d855a890c83e72cb
spec:
  selector:
    matchLabels:
      app: nack
  replicas: 1
  template:
    metadata:
      labels:
        app: nack
        chart: nack-0.34.0_noa
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
      - name: runtime
        emptyDir: {}
      serviceAccountName: jetstream-controller
      containers:
      - name: jsc
        image: nresare/jetstream-controller:issue-380
        imagePullPolicy: IfNotPresent
        workingDir: /nack
        command:
        - /jetstream-controller
        args:
        - -s=nats://nats.nats.svc
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: runtime
          mountPath: /nack
