# Source: webhook-poker
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-poker-config
  namespace: webhook-poker
  annotations:
    noa.re/deploy-id: e2ec7224de2cf307
data:
  webhook-poker.toml: |
    listen = "0.0.0.0"
    port = 8080
    log-level = "INFO"

    [nats]
    servers = ["nats://nats.nats.svc"]
    name = "webhook-poker"  # client name shown in NATS server connection listings
    token-path = "/var/run/secrets/tokens"

    [[target]]
    name = "berries"
    url = "http://argocd-server.argo.svc/api/webhook"

    [[subscription]]
    name = "argo-poker"
    stream = "github-events"
    targets = ["berries"]
