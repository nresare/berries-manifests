# Source: webhook-poker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-poker
  labels:
    app: webhook-poker
  namespace: webhook-poker
  annotations:
    noa.re/deploy-id: 52621872f9e65fcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-poker
  template:
    metadata:
      labels:
        app: webhook-poker
      annotations:
        checksum/config: ec0db4f5c6bac971f6b55229b7c3aa7603ea2ba6518952bdbbe6c49a171ac864
    spec:
      serviceAccountName: webhook-poker
      containers:
      - name: webhook-poker
        image: public.ecr.aws/portswigger-platform/webhook-poker:0.0.6
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: webhook-poker-config
          mountPath: /config
        - name: tokens
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: webhook-poker-config
        configMap:
          name: webhook-poker-config
      - name: tokens
        projected:
          sources:
          - serviceAccountToken:
              path: nats
              expirationSeconds: 3600
              audience: nats
