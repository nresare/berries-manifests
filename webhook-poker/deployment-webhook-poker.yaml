# Source: webhook-poker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-poker
  labels:
    app: webhook-poker
  namespace: webhook-poker
  annotations:
    noa.re/deploy-id: e2ec7224de2cf307
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-poker
  template:
    metadata:
      labels:
        app: webhook-poker
      annotations:
        checksum/config: b4aa7bdf019a94a2e4188b98271c04429c64f1fe3b22b4f87e365851de5a7b30
    spec:
      containers:
      - name: webhook-poker
        image: public.ecr.aws/portswigger-platform/webhook-poker:0.0.6
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: webhook-poker-config
          mountPath: /config
        - name: tokens
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: webhook-poker-config
        configMap:
          name: webhook-poker-config
      - name: tokens
        projected:
          sources:
          - serviceAccountToken:
              path: nats
              expirationSeconds: 3600
              audience: nats
