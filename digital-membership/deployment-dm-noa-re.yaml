# Source: dm.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dm-noa-re
  labels:
    app: dm-noa-re
  namespace: digital-membership
  annotations:
    noa.re/deploy-id: 07b36a8df8f1fb8e
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dm-noa-re
  template:
    metadata:
      labels:
        app: dm-noa-re
      annotations:
        checksum/config: 51413766a31bae162eb26f30d6c0a6ceec759d8cb8e13a45066ed8ccfd3a8a2d
    spec:
      containers:
      - name: dm-noa-re
        image: repo.noa.re/digital-membership:0.1.0-0bf220e9
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: dm-noa-re-config
          mountPath: /config
        - name: keys
          mountPath: /keys
      volumes:
      - name: dm-noa-re-config
        configMap:
          name: dm-noa-re-config
      - name: keys
        secret:
          secretName: keys
