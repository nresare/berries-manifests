# Source: dm.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dm-noa-re
  labels:
    app: dm-noa-re
  namespace: digital-membership
  annotations:
    noa.re/deploy-id: c98be0a3de9cc0ba
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dm-noa-re
  template:
    metadata:
      labels:
        app: dm-noa-re
      annotations:
        checksum/config: 66ff1c36f61c1d69adfc0125799129066e70d7e6c8fcfe6f705bc4013a56d144
    spec:
      containers:
      - name: dm-noa-re
        image: repo.noa.re/digital-membership:0.1.0-7113acd3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: dm-noa-re-config
          mountPath: /config
        - name: keys
          mountPath: /keys
      volumes:
      - name: dm-noa-re-config
        configMap:
          name: dm-noa-re-config
      - name: keys
        secret:
          secretName: keys
